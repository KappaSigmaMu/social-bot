[package]
name = "element-bot"
version = "0.1.0"
edition = "2024"
default-run = "element-bot"

[dependencies]
anyhow = "1"
async-trait = "0.1"
blake2 = "0.10"
bs58 = "0.5"
dotenvy = "0.15"
futures = "0.3"
hex = "0.4"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subxt = { version = "0.50", features = ["jsonrpsee"] }
subxt-rpcs = "0.50"
subxt-signer = "0.50"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "fs"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
